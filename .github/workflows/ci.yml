name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Même version mineure que le serveur en production.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Versions figées : sans cela, une nouvelle version de ruff peut faire
      # échouer la CI sans que le code ait changé, ce qui s'est produit.
      - name: Outils
        run: pip install pytest==9.0.2 ruff==0.16.9 pyyaml==6.0.2

      - name: Lint
        run: |
          ruff check analyse/ tests/
          ruff format --check analyse/ tests/

      - name: Tests
        run: pytest tests/ -q

      - name: Analyse complète du jeu synthétique
        run: |
          python analyse/analyse.py sample-data/ -o /tmp/stats.json
          test -s /tmp/stats.json

      - name: Les agrégats publiés se relisent
        run: |
          for f in resultats/*.json; do
            python -c "import json, sys; d = json.load(open(sys.argv[1])); assert d['totaux']['connexions'] > 0" "$f"
          done

  configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Règles Sigma
        run: |
          pip install pyyaml==6.0.2
          python - <<'EOF'
          import glob, sys, yaml
          requis = ("title", "id", "logsource", "detection", "falsepositives", "level")
          erreurs = 0
          for f in sorted(glob.glob("detections/sigma/*.yml")):
              d = yaml.safe_load(open(f, encoding="utf-8"))
              manque = [c for c in requis if c not in d]
              if manque or "condition" not in d.get("detection", {}):
                  print(f"{f}: champs manquants {manque}")
                  erreurs += 1
              else:
                  print(f"ok  {f}")
          sys.exit(erreurs)
          EOF

      - name: Docker Compose de démonstration
        run: docker compose -f demo/docker-compose.yml config --quiet
